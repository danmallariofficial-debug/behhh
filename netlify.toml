[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Built scripts and styles have a content hash in their name, so browsers can
# keep them for a year and never re-download or re-check them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Stops scrapers and bots from hammering the page function. Two phones (even on
# the same home Wi-Fi) stay far below this.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  [redirects.rate_limit]
    window_limit = 300
    window_size = 60
    aggregate_by = ["ip", "domain"]
